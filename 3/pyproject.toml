[project]
name = "lab3"
version = "0.1.0"
description = "Контурный анализ изображения с текстом и распознавание текста через Tesseract OCR"
readme = "README.md"
authors = [
    { name = "Nickolashaa", email = "gracevnikolaj220@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python>=4.14,<5",
    "pillow>=11.0",
    "pytesseract>=0.3.13",
]

[project.scripts]
lab3 = "lab3:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
