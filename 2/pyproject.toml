[project]
name = "lab2"
version = "0.1.0"
description = "Поиск и распознавание объекта по устойчивым признакам (SIFT), статично и в реальном времени"
readme = "README.md"
authors = [
    { name = "Nickolashaa", email = "gracevnikolaj220@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python>=4.14,<5",
]

[project.scripts]
lab2 = "lab2:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
